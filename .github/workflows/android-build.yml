name: Build Android Release and Debug APKs

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Web Assets
        run: npm run build

      - name: Sync Capacitor Android
        run: |
          npx cap copy android
          npx cap sync android

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Validate Android Project & Wrapper
        run: |
          test -d android
          test -f android/gradlew
          test -f android/gradle/wrapper/gradle-wrapper.properties
          test -f android/gradle/wrapper/gradle-wrapper.jar
          test -f android/capacitor.settings.gradle
          test -f android/app/capacitor.build.gradle
          test -f android/app/build.gradle
          
          python3 -c "
          import os, zipfile, urllib.request

          jar_path = 'android/gradle/wrapper/gradle-wrapper.jar'

          def is_jar_valid(path):
              if not os.path.isfile(path) or os.path.getsize(path) < 10000:
                  return False
              try:
                  with zipfile.ZipFile(path, 'r') as z:
                      return 'org/gradle/wrapper/GradleWrapperMain.class' in z.namelist()
              except Exception:
                  return False

          if not is_jar_valid(jar_path):
              print('Wrapper jar missing or invalid. Auto-downloading official Gradle 8.6 wrapper jar...')
              url = 'https://raw.githubusercontent.com/gradle/gradle/v8.6.0/gradle/wrapper/gradle-wrapper.jar'
              req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
              with urllib.request.urlopen(req) as resp:
                  content = resp.read()
                  os.makedirs(os.path.dirname(jar_path), exist_ok=True)
                  with open(jar_path, 'wb') as f:
                      f.write(content)
              print('Downloaded gradle-wrapper.jar, size:', len(content))

          if not is_jar_valid(jar_path):
              print('Validation failed!')
              exit(1)

          print('Gradle Wrapper JAR validation PASSED!')
          "

          echo "=== Android Directory Structure ==="
          ls -la android
          echo "=== Android App Directory Structure ==="
          ls -la android/app

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Build Android Release and Debug APKs
        run: |
          cd android
          chmod +x gradlew
          java -version
          ./gradlew --version
          ./gradlew --stop
          
          # Generate temporary release keystore for CI if not present
          keytool -genkeypair -v -keystore app/release.jks -alias diguukey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=DiguuAI, OU=Mobile, O=Diguu, L=City, ST=State, C=US"
          
          ./gradlew clean assembleRelease assembleDebug \
            -PRELEASE_STORE_FILE=release.jks \
            -PRELEASE_STORE_PASSWORD=android \
            -PRELEASE_KEY_ALIAS=diguukey \
            -PRELEASE_KEY_PASSWORD=android \
            --stacktrace --no-daemon

      - name: Locate and Verify Generated APKs
        run: |
          python3 -c "
          import os, glob, shutil
          apks = glob.glob('android/app/build/outputs/apk/**/*.apk', recursive=True)
          print('Found generated APKs:', apks)
          if not apks:
              print('ERROR: No APK was generated by Gradle build!')
              exit(1)
          os.makedirs('build_artifacts', exist_ok=True)
          for apk in apks:
              size = os.path.getsize(apk)
              name = os.path.basename(apk)
              target = os.path.join('build_artifacts', name)
              shutil.copyfile(apk, target)
              print(f'Saved artifact: {target}, Size: {size} bytes')
          "

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DIGUU-AI-APK-package
          path: build_artifacts/*.apk
          if-no-files-found: error
